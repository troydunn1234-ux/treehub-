name: TreeHub
options:
  bundleIdPrefix: com.troydunn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_PREVIEWS: YES
targets:
  TreeHub:
    type: application
    platform: iOS
    sources:
      - path: TreeHub
    entitlements:
      path: TreeHub/TreeHub.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.troydunn.treehub
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    info:
      path: TreeHub/Info.plist
      properties:
        CFBundleDisplayName: TreeHub
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - remote-notification
        NSLocationWhenInUseUsageDescription: TreeHub uses your location to track your runs, hikes, rides and drives, and to pin the trees you hug.
        NSLocationAlwaysAndWhenInUseUsageDescription: TreeHub keeps tracking your route while your phone is locked during a recording you started.
        NSMotionUsageDescription: TreeHub uses motion data to tell whether you were walking, running, biking or driving.
        NSCameraUsageDescription: TreeHub uses the camera to snap your tree and your tree selfie.
        NSPhotoLibraryUsageDescription: TreeHub lets you pick tree photos and Garmin screenshots from your library.
        NSHealthShareUsageDescription: TreeHub reads heart rate, breathing rate, mindful minutes and workouts that your Garmin, Whoop and other apps save to Apple Health.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.treehub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
