name: TreeHub
options:
  bundleIdPrefix: com.troydunn
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_PREVIEWS: YES
targets:
  # Rootbound: tree-hugging game (with Stroll / Hike)
  Rootbound:
    type: application
    platform: iOS
    sources:
      - path: TreeHub
      - path: Shared
    dependencies:
      - target: RootboundWidgets
    entitlements:
      path: TreeHub/TreeHub.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.troydunn.rootbound
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    info:
      path: TreeHub/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Rootbound
        NSSupportsLiveActivities: true
        UIRequiresFullScreen: true
        NSHealthUpdateUsageDescription: Rootbound does not write to Apple Health; it only reads your workouts and heart data.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - remote-notification
        NSLocationWhenInUseUsageDescription: Rootbound uses your location to record your strolls and hikes and to pin the trees you hug.
        NSLocationAlwaysAndWhenInUseUsageDescription: Rootbound keeps recording your stroll while your phone is locked.
        NSMotionUsageDescription: Rootbound uses motion data to tell a stroll from a hike.
        NSCameraUsageDescription: Rootbound uses the camera to snap your tree and your tree selfie.
        NSPhotoLibraryUsageDescription: Rootbound lets you pick tree photos and Garmin screenshots from your library.
        NSHealthShareUsageDescription: Rootbound reads heart rate, breathing rate and mindful minutes that your Apple Watch and WHOOP save to Apple Health.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.rootbound
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Roamr: tracker for walks, runs, hikes, rides, drives
  Roamr:
    type: application
    platform: iOS
    sources:
      - path: TrackApp
      - path: Shared
    dependencies:
      - target: RoamrWidgets
      - target: RoamrWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    entitlements:
      path: TrackApp/TrackHub.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.troydunn.roamr
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    info:
      path: TrackApp/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Roamr
        NSSupportsLiveActivities: true
        UIRequiresFullScreen: true
        NSHealthUpdateUsageDescription: Roamr does not write to Apple Health; it only reads your workouts and heart data.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - audio
          - remote-notification
        NSLocationWhenInUseUsageDescription: Roamr uses your location to record the route of your walks, runs, hikes, rides and drives.
        NSLocationAlwaysAndWhenInUseUsageDescription: Roamr keeps recording your route while your phone is locked, and notices when you start driving so it can offer to track the drive.
        NSMotionUsageDescription: Roamr uses motion data to tell whether you were walking, running, biking or driving.
        NSHealthShareUsageDescription: Roamr reads the workouts and heart rate that your Apple Watch and WHOOP save to Apple Health.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.roamr
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TRACK_APP"


  # Lock Screen / Dynamic Island live activity for Rootbound
  RootboundWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RootboundWidgets
      - path: Shared/LiveActivity/TrackingActivityAttributes.swift
    info:
      path: RootboundWidgets/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Rootbound
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.rootbound.widgets
        SKIP_INSTALL: YES

  # Lock Screen / Dynamic Island live activity for Roamr
  RoamrWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RoamrWidgets
      - path: Shared/LiveActivity/TrackingActivityAttributes.swift
    info:
      path: RoamrWidgets/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Roamr
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.roamr.widgets
        SKIP_INSTALL: YES

  RootboundUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TreeHubUITests
    dependencies:
      - target: Rootbound
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.rootbound.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Rootbound

  RoamrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TrackHubUITests
    dependencies:
      - target: Roamr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.roamr.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Roamr

  RootboundTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RootboundTests
    dependencies:
      - target: Rootbound
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.rootbound.tests
        GENERATE_INFOPLIST_FILE: YES

  # Food Book: native calorie logger
  FoodBook:
    type: application
    platform: iOS
    sources:
      - path: FoodApp
      - path: WebApps/FoodBook/Assets.xcassets
    dependencies:
      - target: FoodBookWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
      # - target: FoodBookWidgets   # TODO re-enable once App Groups are registered (see docs/WIDGETS.md)
      #   embed: true
    entitlements:
      path: FoodApp/FoodBook.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # com.apple.security.application-groups: [group.com.troydunn.foodbook]   # TODO re-enable once App Groups are registered
    info:
      path: WebApps/FoodBook/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Food Book
        CFBundleURLTypes:
          - CFBundleURLName: com.troydunn.foodbook
            CFBundleURLSchemes: [foodbook]
        NSCameraUsageDescription: Snap your food and Food Book fills in the calories and macros.
        NSPhotoLibraryUsageDescription: Pick a food photo and Food Book fills in the calories and macros.
        NSHealthShareUsageDescription: Food Book reads your active calories and workouts from Apple Health (including Whoop and Apple Watch) to show what you've burned.
        NSHealthUpdateUsageDescription: Food Book saves the meals you log to Apple Health.
        UIRequiresFullScreen: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.foodbook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # Pulse Lab: Apple Watch (Health) vs WHOOP, side by side
  PulseLab:
    type: application
    platform: iOS
    sources:
      - path: PulseLab
      - path: Shared/Store
    # dependencies:
      # - target: PulseLabWidgets   # TODO re-enable once App Groups are registered (see docs/WIDGETS.md)
      #   embed: true
    entitlements:
      path: PulseLab/PulseLab.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # com.apple.security.application-groups: [group.com.troydunn.pulselab]   # TODO re-enable once App Groups are registered
    info:
      path: PulseLab/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Pulse Lab
        ProProductID: com.troydunn.pulselab.pro
        PaidUntilBuild: 0
        NSHealthShareUsageDescription: Pulse Lab reads your heart, sleep, activity and workout data from Apple Health (including what WHOOP saves there) to compare your Apple Watch and WHOOP side by side.
        NSHealthUpdateUsageDescription: Pulse Lab only reads your health data and never writes to Apple Health.
        CFBundleURLTypes:
          - CFBundleURLName: com.troydunn.pulselab
            CFBundleURLSchemes:
              - pulselab
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.pulselab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  # Still Point: meditation & breath guide (Apple Watch first, iPhone companion)
  StillPoint:
    type: application
    platform: iOS
    sources:
      - path: StillPoint
      - path: Shared/Store
    dependencies:
      - target: StillPointWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
      # - target: StillPointWidgets   # TODO re-enable once App Groups are registered (see docs/WIDGETS.md)
      #   embed: true
    entitlements:
      path: StillPoint/StillPoint.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # com.apple.security.application-groups: [group.com.troydunn.stillpoint]   # TODO re-enable once App Groups are registered
    info:
      path: StillPoint/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Still Point
        CFBundleURLTypes:
          - CFBundleURLName: com.troydunn.stillpoint
            CFBundleURLSchemes: [stillpoint]
        ProProductID: com.troydunn.stillpoint.pro
        PaidUntilBuild: 0
        NSHealthShareUsageDescription: Still Point reads your mindful minutes, heart rate and HRV to show how your practice is going.
        NSHealthUpdateUsageDescription: Still Point saves your sessions to Apple Health as Mindful Minutes.
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.stillpoint
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  StillPointWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: StillPointWatch
      - path: StillPoint/Shared
    # dependencies:
      # - target: StillPointWatchWidgets   # TODO re-enable once App Groups are registered (see docs/WIDGETS.md)
      #   embed: true
    entitlements:
      path: StillPointWatch/StillPointWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # com.apple.security.application-groups: [group.com.troydunn.stillpoint]   # TODO re-enable once App Groups are registered
    info:
      path: StillPointWatch/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Still Point
        CFBundleURLTypes:
          - CFBundleURLName: com.troydunn.stillpoint.watchkitapp
            CFBundleURLSchemes: [stillpoint]
        ProProductID: com.troydunn.stillpoint.pro
        PaidUntilBuild: 0
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.troydunn.stillpoint
        WKBackgroundModes:
          - mindfulness
          - workout-processing
        NSHealthShareUsageDescription: Still Point reads your heart rate and HRV during sessions to show how you settle.
        NSHealthUpdateUsageDescription: Still Point saves your sessions to Apple Health as Mindful Minutes.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.stillpoint.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Natal Orbit: bundled web app in a native shell
  NatalOrbit:
    type: application
    platform: iOS
    sources:
      - path: WebApps/Shell
      - path: WebApps/NatalOrbit/Assets.xcassets
      - path: WebApps/NatalOrbit/web
        type: folder
        buildPhase: resources
    info:
      path: WebApps/NatalOrbit/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Natal Orbit
        WebShellBackground: "#05070f"
        WebShellAccent: "#f2c46d"
        WebShellSymbol: sparkles
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: Natal Orbit saves the images you choose to keep.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.natalorbit
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Ride Quest: bundled web app in a native shell
  RideQuest:
    type: application
    platform: iOS
    sources:
      - path: WebApps/Shell
      - path: WebApps/QuestApp/Assets.xcassets
      - path: WebApps/QuestApp/web
        type: folder
        buildPhase: resources
      - path: WebApps/QuestApp/seed.json
        buildPhase: resources
    info:
      path: WebApps/QuestApp/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Ride Quest
        WebShellBackground: "#050c08"
        WebShellAccent: "#3dff95"
        WebShellSymbol: flag.checkered
        WebShellBankSync: true
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: Ride Quest saves the images you choose to keep.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.ridequest
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Clicker: Vizio TV remote and app launcher
  Clicker:
    type: application
    platform: iOS
    sources:
      - path: TVRemote
      - path: Shared/Store
    dependencies:
      - target: ClankerrWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    entitlements:
      path: TVRemote/Clicker.entitlements
      properties:
        com.apple.developer.game-center: true
        # com.apple.security.application-groups: [group.com.troydunn.clicker]   # TODO re-enable once App Groups are registered
    info:
      path: TVRemote/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Couch Remote
        CFBundleURLTypes:
          - CFBundleURLName: com.troydunn.clicker
            CFBundleURLSchemes: [couchremote]
        ProProductID: com.troydunn.clicker.pro
        # Anyone whose first download was build 73 or earlier bought Couch Remote while it was a paid app: Pro is theirs.
        PaidUntilBuild: 73
        UIRequiresFullScreen: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: Couch Remote finds and controls your TV (and your PC, if you want) on your Wi-Fi.
        NSBonjourServices:
          - _viziocast._tcp
          - _clankerr._tcp
          - _androidtvremote2._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.clicker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Apple Watch companions (embedded in each iPhone app's Watch folder)
  RoamrWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: RoamrWatch
    info:
      path: RoamrWatch/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Roamr
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.troydunn.roamr
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.roamr.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Food Book on Apple Watch
  FoodBookWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: FoodBookWatch
    info:
      path: FoodBookWatch/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Food Book
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.troydunn.foodbook
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.foodbook.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Couch Remote (was Clankerr) on Apple Watch
  ClankerrWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ClankerrWatch
    # dependencies:
      # - target: ClankerrWidgets   # TODO re-enable once App Groups are registered (see docs/WIDGETS.md)
      #   embed: true
    entitlements:
      path: ClankerrWatch/ClankerrWatch.entitlements
      properties:
        # com.apple.security.application-groups: [group.com.troydunn.clicker]   # TODO re-enable once App Groups are registered
    info:
      path: ClankerrWatch/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Couch Remote
        CFBundleURLTypes:
          - CFBundleURLName: com.troydunn.clicker.watchkitapp
            CFBundleURLSchemes: [couchremote]
        ProProductID: com.troydunn.clicker.pro
        # Anyone whose first download was build 73 or earlier bought Couch Remote while it was a paid app: Pro is theirs.
        PaidUntilBuild: 73
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.troydunn.clicker
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.clicker.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  StillPointWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: StillPointWidgets
    entitlements:
      path: StillPointWidgets/StillPointWidgets.entitlements
      properties:
        # com.apple.security.application-groups: [group.com.troydunn.stillpoint]   # TODO re-enable once App Groups are registered
    info:
      path: StillPointWidgets/StillPointWidgets.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Still Point
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.stillpoint.widgets
        SKIP_INSTALL: YES

  StillPointWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: StillPointWidgets
    entitlements:
      path: StillPointWidgets/StillPointWatchWidgets.entitlements
      properties:
        # com.apple.security.application-groups: [group.com.troydunn.stillpoint]   # TODO re-enable once App Groups are registered
    info:
      path: StillPointWidgets/StillPointWatchWidgets.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Still Point
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.stillpoint.watchkitapp.widgets
        SKIP_INSTALL: YES

  PulseLabWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PulseLabWidgets
    entitlements:
      path: PulseLabWidgets/PulseLabWidgets.entitlements
      properties:
        # com.apple.security.application-groups: [group.com.troydunn.pulselab]   # TODO re-enable once App Groups are registered
    info:
      path: PulseLabWidgets/PulseLabWidgets.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Pulse Lab
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.pulselab.widgets
        SKIP_INSTALL: YES

  ClankerrWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ClankerrWidgets
    entitlements:
      path: ClankerrWidgets/ClankerrWidgets.entitlements
      properties:
        # com.apple.security.application-groups: [group.com.troydunn.clicker]   # TODO re-enable once App Groups are registered
    info:
      path: ClankerrWidgets/ClankerrWidgets.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Couch Remote
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.clicker.watchkitapp.widgets
        SKIP_INSTALL: YES

  FoodBookWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FoodBookWidgets
    entitlements:
      path: FoodBookWidgets/FoodBookWidgets.entitlements
      properties:
        # com.apple.security.application-groups: [group.com.troydunn.foodbook]   # TODO re-enable once App Groups are registered
    info:
      path: FoodBookWidgets/FoodBookWidgets.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Food Book
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.foodbook.widgets
        SKIP_INSTALL: YES

schemes:
  Rootbound:
    build:
      targets:
        Rootbound: all
        RootboundTests: [test]
        RootboundUITests: [test]
    test:
      targets:
        - RootboundTests
        - RootboundUITests
  Roamr:
    build:
      targets:
        Roamr: all
        RoamrUITests: [test]
    test:
      targets:
        - RoamrUITests
  FoodBook:
    build:
      targets:
        FoodBook: all
  NatalOrbit:
    build:
      targets:
        NatalOrbit: all
  RideQuest:
    build:
      targets:
