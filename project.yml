name: TreeHub
options:
  bundleIdPrefix: com.troydunn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_PREVIEWS: YES
targets:
  # Tree Hugger game (with Stroll / Hike)
  TreeHub:
    type: application
    platform: iOS
    sources:
      - path: TreeHub
      - path: Shared
    entitlements:
      path: TreeHub/TreeHub.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.troydunn.treehub
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    info:
      path: TreeHub/Info.plist
      properties:
        CFBundleDisplayName: TreeHub
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - remote-notification
        NSLocationWhenInUseUsageDescription: TreeHub uses your location to record your strolls and hikes and to pin the trees you hug.
        NSLocationAlwaysAndWhenInUseUsageDescription: TreeHub keeps recording your stroll while your phone is locked.
        NSMotionUsageDescription: TreeHub uses motion data to tell a stroll from a hike.
        NSCameraUsageDescription: TreeHub uses the camera to snap your tree and your tree selfie.
        NSPhotoLibraryUsageDescription: TreeHub lets you pick tree photos and Garmin screenshots from your library.
        NSHealthShareUsageDescription: TreeHub reads heart rate, breathing rate and mindful minutes that your Garmin and Whoop save to Apple Health.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.treehub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Standalone tracker: walks, runs, hikes, rides, drives
  TrackHub:
    type: application
    platform: iOS
    sources:
      - path: TrackApp
      - path: Shared
    entitlements:
      path: TrackApp/TrackHub.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.troydunn.trackhub
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    info:
      path: TrackApp/Info.plist
      properties:
        CFBundleDisplayName: TrackHub
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - remote-notification
        NSLocationWhenInUseUsageDescription: TrackHub uses your location to record the route of your walks, runs, hikes, rides and drives.
        NSLocationAlwaysAndWhenInUseUsageDescription: TrackHub keeps recording your route while your phone is locked.
        NSMotionUsageDescription: TrackHub uses motion data to tell whether you were walking, running, biking or driving.
        NSHealthShareUsageDescription: TrackHub reads the workouts and heart rate that your Garmin and Whoop save to Apple Health.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.trackhub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TRACK_APP"

  TreeHubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TreeHubUITests
    dependencies:
      - target: TreeHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.treehub.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TreeHub

  TrackHubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TrackHubUITests
    dependencies:
      - target: TrackHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.trackhub.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TrackHub

schemes:
  TreeHub:
    build:
      targets:
        TreeHub: all
        TreeHubUITests: [test]
    test:
      targets:
        - TreeHubUITests
  TrackHub:
    build:
      targets:
        TrackHub: all
        TrackHubUITests: [test]
    test:
      targets:
        - TrackHubUITests
