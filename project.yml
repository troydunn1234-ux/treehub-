name: TreeHub
options:
  bundleIdPrefix: com.troydunn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_PREVIEWS: YES
targets:
  # Rootbound: tree-hugging game (with Stroll / Hike)
  Rootbound:
    type: application
    platform: iOS
    sources:
      - path: TreeHub
      - path: Shared
    dependencies:
      - target: RootboundWidgets
    entitlements:
      path: TreeHub/TreeHub.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.troydunn.rootbound
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    info:
      path: TreeHub/Info.plist
      properties:
        CFBundleDisplayName: Rootbound
        NSSupportsLiveActivities: true
        UIRequiresFullScreen: true
        NSHealthUpdateUsageDescription: Rootbound does not write to Apple Health; it only reads your workouts and heart data.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - remote-notification
        NSLocationWhenInUseUsageDescription: Rootbound uses your location to record your strolls and hikes and to pin the trees you hug.
        NSLocationAlwaysAndWhenInUseUsageDescription: Rootbound keeps recording your stroll while your phone is locked.
        NSMotionUsageDescription: Rootbound uses motion data to tell a stroll from a hike.
        NSCameraUsageDescription: Rootbound uses the camera to snap your tree and your tree selfie.
        NSPhotoLibraryUsageDescription: Rootbound lets you pick tree photos and Garmin screenshots from your library.
        NSHealthShareUsageDescription: Rootbound reads heart rate, breathing rate and mindful minutes that your Garmin and Whoop save to Apple Health.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.rootbound
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Roamr: tracker for walks, runs, hikes, rides, drives
  Roamr:
    type: application
    platform: iOS
    sources:
      - path: TrackApp
      - path: Shared
    dependencies:
      - target: RoamrWidgets
    entitlements:
      path: TrackApp/TrackHub.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.troydunn.roamr
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    info:
      path: TrackApp/Info.plist
      properties:
        CFBundleDisplayName: Roamr
        NSSupportsLiveActivities: true
        UIRequiresFullScreen: true
        NSHealthUpdateUsageDescription: Roamr does not write to Apple Health; it only reads your workouts and heart data.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - remote-notification
        NSLocationWhenInUseUsageDescription: Roamr uses your location to record the route of your walks, runs, hikes, rides and drives.
        NSLocationAlwaysAndWhenInUseUsageDescription: Roamr keeps recording your route while your phone is locked.
        NSMotionUsageDescription: Roamr uses motion data to tell whether you were walking, running, biking or driving.
        NSHealthShareUsageDescription: Roamr reads the workouts and heart rate that your Garmin and Whoop save to Apple Health.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.roamr
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TRACK_APP"


  # Lock Screen / Dynamic Island live activity for Rootbound
  RootboundWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RootboundWidgets
      - path: Shared/LiveActivity/TrackingActivityAttributes.swift
    info:
      path: RootboundWidgets/Info.plist
      properties:
        CFBundleDisplayName: Rootbound
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.rootbound.widgets
        SKIP_INSTALL: YES

  # Lock Screen / Dynamic Island live activity for Roamr
  RoamrWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RoamrWidgets
      - path: Shared/LiveActivity/TrackingActivityAttributes.swift
    info:
      path: RoamrWidgets/Info.plist
      properties:
        CFBundleDisplayName: Roamr
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.roamr.widgets
        SKIP_INSTALL: YES

  RootboundUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TreeHubUITests
    dependencies:
      - target: Rootbound
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.rootbound.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Rootbound

  RoamrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TrackHubUITests
    dependencies:
      - target: Roamr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.roamr.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Roamr

  RootboundTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RootboundTests
    dependencies:
      - target: Rootbound
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troydunn.rootbound.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Rootbound:
    build:
      targets:
        Rootbound: all
        RootboundTests: [test]
        RootboundUITests: [test]
    test:
      targets:
        - RootboundTests
        - RootboundUITests
  Roamr:
    build:
      targets:
        Roamr: all
        RoamrUITests: [test]
    test:
      targets:
        - RoamrUITests
