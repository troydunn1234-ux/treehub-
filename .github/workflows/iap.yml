name: App Store IAP (Pro unlock)
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app
        type: choice
        options: [StillPoint, PulseLab, Clicker]
        default: StillPoint
jobs:
  iap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pip install --quiet "pyjwt[crypto]"
          printf '%s\n' "$P8" > /tmp/key.p8
          case "${{ inputs.app }}" in
            StillPoint) B=com.troydunn.stillpoint; P=1.99; N="Still Point Pro"; D="All practices, routines and Watch library." ;;
            PulseLab)   B=com.troydunn.pulselab;   P=2.99; N="Pulse Lab Pro";   D="VS lab, 90-day history, share + CSV export." ;;
            Clicker)    B=com.troydunn.clicker;    P=2.99; N="Couch Remote Pro"; D="Unlimited TVs, TV keyboard and PC remote." ;;
          esac
          SHOT=store/$(echo ${{ inputs.app }} | tr A-Z a-z)/iap-review.png
          [ -f "$SHOT" ] || SHOT=""
          KEY_PATH=/tmp/key.p8 python3 .github/scripts/asc_iap.py "$B" "$B.pro" "$P" "$N" "$D" $SHOT
          rm -f /tmp/key.p8
