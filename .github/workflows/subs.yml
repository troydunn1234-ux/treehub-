name: App Store subscriptions
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app
        type: choice
        options: [StillPoint]
        default: StillPoint
jobs:
  subs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet "pyjwt[crypto]"
      - env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          printf '%s\n' "$P8" > /tmp/key.p8
          case "${{ inputs.app }}" in
            StillPoint) B=com.troydunn.stillpoint; C=store/stillpoint/subscriptions.json ;;
            *) echo "Unknown app"; exit 1 ;;
          esac
          KEY_PATH=/tmp/key.p8 python3 .github/scripts/asc_subs.py "$B" "$C"
      - if: always()
        run: rm -f /tmp/key.p8
