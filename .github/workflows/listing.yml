name: Update App Store listing

# Run by hand: takes clean demo-mode screenshots in the simulator (iPhone 6.9", iPad 13" when the app runs on iPad,
# Apple Watch when the app has one,
# and the paywall for in-app purchase review), captions the iPhone ones, and fills in the App Store page from
# store/<app>/metadata.json: text, screenshots, price, age rating, availability, review notes, build, and the
# review screenshot on every in-app purchase / subscription. It never submits anything for review.
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app
        type: choice
        options: [Clicker, NatalOrbit, StillPoint, PulseLab, Rootbound, Roamr, RideQuest]
        default: Clicker
      upload:
        description: Send to App Store Connect (off = screenshots only)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: listing-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  listing:
    runs-on: macos-15-intel
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4

      - name: Pick app settings
        run: |
          STORE=store/$(echo "${{ inputs.app }}" | tr A-Z a-z)
          echo "STORE=$STORE" >> $GITHUB_ENV
          echo "BUNDLE=$(python3 -c "import json;print(json.load(open('$STORE/metadata.json'))['bundle'])")" >> $GITHUB_ENV
          echo "HAS_WATCH=$(python3 -c "import json;print('1' if json.load(open('$STORE/metadata.json')).get('watch') else '')")" >> $GITHUB_ENV

      - name: Pick newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Make sure the watchOS SDK is installed (Apple Watch apps)
        run: xcodebuild -showsdks | grep -q watchos || xcodebuild -downloadPlatform watchOS

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          # Store screenshots use made-up demo data only. Ride Quest starts from a demo save file.
          for d in FoodBook QuestApp; do [ -f WebApps/$d/seed.json ] || echo '{}' > WebApps/$d/seed.json; done
          if [ "${{ inputs.app }}" = RideQuest ]; then python3 store/ridequest/demo_seed.py > WebApps/QuestApp/seed.json; fi
          xcodegen generate

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build -project TreeHub.xcodeproj -scheme ${{ inputs.app }} \
            -destination 'generic/platform=iOS Simulator' -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log || { grep -E "error:" build.log | head -30; exit 1; }

      - name: Build the Apple Watch app for its simulator
        if: env.HAS_WATCH == '1'
        run: |
          W=$(python3 -c "import json;print(json.load(open('$STORE/metadata.json'))['watch']['product'])")
          if [ ! -d build/Build/Products/Release-watchsimulator/$W.app ]; then
            xcodebuild build -project TreeHub.xcodeproj -target $W -sdk watchsimulator -configuration Release \
              SYMROOT=$PWD/build/Build/Products CODE_SIGNING_ALLOWED=NO | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          fi
          ls -d build/Build/Products/Release-watchsimulator/*.app || true

      - name: Screenshots (demo data only)
        env: { PYTHONUNBUFFERED: "1" }
        run: |
          pip3 install --quiet --break-system-packages pillow "pyjwt[crypto]" || pip3 install --quiet pillow "pyjwt[crypto]"
          python3 .github/scripts/store_capture.py $STORE/metadata.json build/Build/Products shots

      - name: Caption the iPhone screenshots
        run: |
          pip3 install --quiet --break-system-packages pillow "pyjwt[crypto]" || pip3 install --quiet pillow "pyjwt[crypto]"
          python3 .github/scripts/marketing_shots.py $STORE/metadata.json shots/raw store-shots
          if ls shots/ipad/*.png >/dev/null 2>&1; then
            python3 .github/scripts/marketing_shots.py $STORE/metadata.json shots/ipad store-shots-ipad --ipad
          fi

      - name: Fill in the App Store page
        if: inputs.upload
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$P8" > ~/private_keys/AuthKey_${KID}.p8
          export KEY_PATH=$HOME/private_keys/AuthKey_${KID}.p8
          python3 .github/scripts/asc_listing.py $BUNDLE $STORE/metadata.json store-shots shots/watch store-shots-ipad || echo "::warning::listing step failed"
          PRICE=$(python3 -c "import json;print(json.load(open('$STORE/metadata.json')).get('price',''))")
          [ -n "$PRICE" ] && { python3 .github/scripts/asc_price.py $BUNDLE $PRICE || echo "::warning::price step failed"; }
          python3 .github/scripts/asc_ready.py $BUNDLE $STORE/metadata.json || echo "::warning::ready step failed"
          if [ -f shots/paywall/iap-review.png ]; then
            FORCE=1 python3 .github/scripts/asc_review_shots.py $BUNDLE shots/paywall/iap-review.png || echo "::warning::review screenshot step failed"
          fi

      - name: Remove key
        if: always()
        run: rm -rf ~/private_keys

      - name: Publish the screenshots to the store-shots-<app> branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          TMP=$(mktemp -d); mkdir -p "$TMP/raw"
          cp -R store-shots/. "$TMP"/ 2>/dev/null || true
          [ -d store-shots-ipad ] && { mkdir -p "$TMP/ipad"; cp -R store-shots-ipad/. "$TMP/ipad"/; } || true
          cp -R shots/. "$TMP/raw"/ 2>/dev/null || true
          grep -E "error:" build.log | head -40 > "$TMP/build-errors.txt" 2>/dev/null || true
          BR=store-shots-$(echo "${{ inputs.app }}" | tr A-Z a-z)
          cd "$TMP"; git init -q -b $BR
          git config user.name "TreeHub CI"; git config user.email "ci@users.noreply.github.com"
          git add -A; git commit -q -m "Store screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" $BR
