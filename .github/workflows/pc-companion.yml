name: Build Clankerr PC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['PCCompanion/**', '.github/workflows/pc-companion.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the code
        run: python -m py_compile PCCompanion/clankerr_pc.py
      - name: Build ClankerrPC.exe
        working-directory: PCCompanion
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --onefile --noconsole --name ClankerrPC clankerr_pc.py
      - name: Publish to the pc-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete pc-latest --yes --cleanup-tag || true
          gh release create pc-latest PCCompanion/dist/ClankerrPC.exe \
            --title "Clankerr PC (latest)" \
            --notes "Download ClankerrPC.exe and run it. See PCCompanion/README.md for setup." \
            --target ${{ github.sha }}
