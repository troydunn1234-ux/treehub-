name: Speed limit diagnostics
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for P in "37.3302,-122.0480,300" "37.2872,-121.9500,60" "37.3230,-121.9520,60"; do
            Q="[out:json][timeout:20];way(around:${P##*,},${P%,*})[highway~\"^(motorway|trunk|primary|secondary|tertiary|residential)$\"];out tags;"
            for S in https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass-api.de/api/interpreter; do
              echo "== $S at $P"
              curl -s -m 30 -o out.json -w "status=%{http_code} size=%{size_download} time=%{time_total}\n" -A "Roamr iOS app" --data-urlencode "data=$Q" "$S" || echo "curl failed $?"
              python3 -c "
          import json
          try:
              d=json.load(open('out.json'))['elements']
              print(len(d),'ways:',[(w['tags'].get('highway'),w['tags'].get('ref') or w['tags'].get('name'),w['tags'].get('maxspeed')) for w in d][:8])
          except Exception as e: print('parse error',e)"
            done
          done
