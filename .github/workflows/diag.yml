name: Speed limit diagnostics
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          Q='[out:json][timeout:20];way(around:30,37.3302,-122.0480)[highway~"^(motorway|trunk|primary|secondary|residential)$"];out tags;'
          for S in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.private.coffee/api/interpreter; do
            for UA in "" "Roamr iOS app (personal route tracker)"; do
              echo "== $S UA='$UA' POST"
              curl -s -m 25 -o out.json -w "status=%{http_code} size=%{size_download}\n" ${UA:+-A "$UA"} --data-urlencode "data=$Q" "$S"
              head -c 300 out.json; echo
            done
          done
