name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      schemes:
        description: Space-separated schemes to build (blank = all)
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Make sure the watchOS SDK is installed (Apple Watch apps)
        run: xcodebuild -showsdks | grep -q watchos || xcodebuild -downloadPlatform watchOS

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          # Personal starting data is not in the public repo; build with empty data instead.
          for d in FoodBook QuestApp; do [ -f WebApps/$d/seed.json ] || echo '{}' > WebApps/$d/seed.json; done
          xcodegen generate

      - name: Build both apps for iOS Simulator (no signing)
        run: |
          set -o pipefail
          ALL="Rootbound Roamr NatalOrbit RideQuest Clicker PulseLab StillPoint"
          PICK="${{ github.event.inputs.schemes }}"
          if [ -z "$PICK" ] && [ "${{ github.event_name }}" = "push" ]; then
            # Only build the apps touched by this push (GitHub kills macOS jobs at ~15 min).
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || echo all)
            PICK=""
            echo "$CHANGED" | grep -qE '^(TreeHub|RootboundTests)/|^Shared/' && PICK="$PICK Rootbound"
            echo "$CHANGED" | grep -qE '^(TrackApp|RoamrWatch)/|^Shared/' && PICK="$PICK Roamr"
            echo "$CHANGED" | grep -qE '^WebApps/(Shell|NatalOrbit)/' && PICK="$PICK NatalOrbit"
            echo "$CHANGED" | grep -qE '^WebApps/(Shell|QuestApp)/' && PICK="$PICK RideQuest"
            echo "$CHANGED" | grep -qE '^(TVRemote|ClankerrWatch)/' && PICK="$PICK Clicker"
            echo "$CHANGED" | grep -qE '^PulseLab/' && PICK="$PICK PulseLab"
            echo "$CHANGED" | grep -qE '^(StillPoint|StillPointWatch)/' && PICK="$PICK StillPoint"
            echo "$CHANGED" | grep -qE '^project.yml|^.github/|^all$' && PICK="$ALL"
          fi
          [ -z "$PICK" ] && PICK="$ALL"
          echo "Building: $PICK"
          for SCHEME in $PICK; do
            echo "=== $SCHEME ==="
            xcodebuild build \
              -project TreeHub.xcodeproj \
              -scheme $SCHEME \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              | tee -a build.log | grep -E "error:|warning: |BUILD (SUCCEEDED|FAILED)" || true
          done
          WANT=$(echo $PICK | wc -w | tr -d ' ')
          [ "$(grep -c 'BUILD SUCCEEDED' build.log)" -eq "$WANT" ]

      - name: Show errors
        if: failure()
        run: grep -n "error:" build.log | head -80 || true

      - name: Unit tests (game logic, map links, tracking math)
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(dv["udid"] for rt in sorted(d,reverse=True) if "iOS" in rt for dv in d[rt] if dv["name"].startswith("iPhone")))')
          xcodebuild test -project TreeHub.xcodeproj -scheme Rootbound -destination "id=$UDID" \
            -derivedDataPath build -only-testing:RootboundTests CODE_SIGNING_ALLOWED=NO 2>&1 \
            | grep -E "Test Case .*(passed|failed)|error:|TEST (SUCCEEDED|FAILED)|Executed" | tail -40

      - name: Run in simulator and screenshot
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        run: bash .github/scripts/screenshots.sh

      - name: Run the web apps and screenshot
        if: always() && github.event_name == 'workflow_dispatch'
        timeout-minutes: 25
        run: bash .github/scripts/webshots.sh

      - name: Upload screenshots
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore

      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          [ -d shots ] || exit 0
          TMP=$(mktemp -d)
          cp -R shots/. "$TMP"/
          cd "$TMP"
          git init -q -b ci-screenshots
          git config user.name "TreeHub CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots

      - name: Commit generated Xcode project
        if: success()
        run: |
          git config user.name "TreeHub CI"
          git config user.email "ci@users.noreply.github.com"
          git add TreeHub.xcodeproj TreeHub/Info.plist TreeHub/TreeHub.entitlements TrackApp/Info.plist TrackApp/TrackHub.entitlements RootboundWidgets/Info.plist RoamrWidgets/Info.plist WebApps/*/Info.plist TVRemote/Info.plist RoamrWatch/Info.plist FoodBookWatch/Info.plist ClankerrWatch/Info.plist PulseLab/Info.plist PulseLab/PulseLab.entitlements StillPoint/Info.plist StillPoint/StillPoint.entitlements StillPointWatch/Info.plist StillPointWatch/StillPointWatch.entitlements
          if git diff --cached --quiet; then
            echo "Project unchanged"
          else
            git commit -m "Update generated Xcode project [skip ci]"
            git pull --rebase origin main
            git push
          fi
