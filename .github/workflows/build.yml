name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build both apps for iOS Simulator (no signing)
        run: |
          set -o pipefail
          for SCHEME in TreeHub TrackHub; do
            echo "=== $SCHEME ==="
            xcodebuild build \
              -project TreeHub.xcodeproj \
              -scheme $SCHEME \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              | tee -a build.log | grep -E "error:|warning: |BUILD (SUCCEEDED|FAILED)" || true
          done
          [ "$(grep -c 'BUILD SUCCEEDED' build.log)" -eq 2 ]

      - name: Show errors
        if: failure()
        run: grep -n "error:" build.log | head -80 || true

      - name: Run in simulator and screenshot
        run: bash .github/scripts/screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore

      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          TMP=$(mktemp -d)
          cp -R shots/. "$TMP"/
          cd "$TMP"
          git init -q -b ci-screenshots
          git config user.name "TreeHub CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots

      - name: Commit generated Xcode project
        if: success()
        run: |
          git config user.name "TreeHub CI"
          git config user.email "ci@users.noreply.github.com"
          git add TreeHub.xcodeproj TreeHub/Info.plist TreeHub/TreeHub.entitlements TrackApp/Info.plist TrackApp/TrackHub.entitlements
          if git diff --cached --quiet; then
            echo "Project unchanged"
          else
            git commit -m "Update generated Xcode project [skip ci]"
            git pull --rebase origin main
            git push
          fi
