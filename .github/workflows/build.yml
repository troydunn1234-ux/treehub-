name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      schemes:
        description: Space-separated schemes to build (blank = all)
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Make sure the watchOS SDK is installed (Apple Watch apps)
        run: xcodebuild -showsdks | grep -q watchos || xcodebuild -downloadPlatform watchOS

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          # Personal starting data is not in the public repo; build with empty data instead.
          for d in FoodBook QuestApp; do [ -f WebApps/$d/seed.json ] || echo '{}' > WebApps/$d/seed.json; done
          xcodegen generate

      - name: Data guard (store location, entitlements, model fields, saved keys, permission texts, links)
        run: python3 .github/scripts/data_guard.py --generated

      - name: Build both apps for iOS Simulator (no signing)
        run: |
          set -o pipefail
          ALL="Rootbound Roamr RideQuest Clicker PulseLab StillPoint"
          PICK="${{ github.event.inputs.schemes }}"
          if [ -z "$PICK" ] && [ "${{ github.event_name }}" = "push" ]; then
            # Only build the apps touched by this push (GitHub kills macOS jobs at ~15 min).
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || echo all)
            PICK=""
            echo "$CHANGED" | grep -qE '^(TreeHub|RootboundTests)/|^Shared/' && PICK="$PICK Rootbound"
            echo "$CHANGED" | grep -qE '^(TrackApp|RoamrWatch|RoamrTests)/|^Shared/' && PICK="$PICK Roamr"
            true  # Natal Orbit paused: no more builds
            echo "$CHANGED" | grep -qE '^WebApps/(Shell|QuestApp)/' && PICK="$PICK RideQuest"
            echo "$CHANGED" | grep -qE '^(TVRemote|ClankerrWatch)/' && PICK="$PICK Clicker"
            echo "$CHANGED" | grep -qE '^PulseLab(Watch|WatchWidgets|Widgets|Tests)?/' && PICK="$PICK PulseLab"
            echo "$CHANGED" | grep -qE '^(StillPoint|StillPointWatch|StillPointTests)/' && PICK="$PICK StillPoint"
            echo "$CHANGED" | grep -qE '^TestSupport/' && PICK="$PICK Rootbound Roamr PulseLab StillPoint"
            echo "$CHANGED" | grep -qE '^project.yml|^.github/|^all$' && PICK="$ALL"
          fi
          [ -z "$PICK" ] && PICK="$ALL"
          echo "Building: $PICK"
          echo $PICK > picked-schemes.txt
          for SCHEME in $PICK; do
            echo "=== $SCHEME ==="
            xcodebuild build \
              -project TreeHub.xcodeproj \
              -scheme $SCHEME \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              | tee -a build.log | grep -E "error:|warning: |BUILD (SUCCEEDED|FAILED)" || true
          done
          WANT=$(echo $PICK | wc -w | tr -d ' ')
          [ "$(grep -c 'BUILD SUCCEEDED' build.log)" -eq "$WANT" ]

      - name: Show errors
        if: failure()
        run: grep -n "error:" build.log | head -80 || true

      - name: Unit tests (data safety in every app; Rootbound game logic, map links, tracking math)
        run: |
          set -o pipefail
          PICK=$(cat picked-schemes.txt)
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(dv["udid"] for rt in sorted(d,reverse=True) if "iOS" in rt for dv in d[rt] if dv["name"].startswith("iPhone")))')
          RAN=0
          touch test.log
          for SCHEME in Rootbound Roamr PulseLab StillPoint; do
            echo " $PICK " | grep -q " $SCHEME " || continue
            echo "=== ${SCHEME}Tests ==="
            xcodebuild test -project TreeHub.xcodeproj -scheme $SCHEME -destination "id=$UDID" \
              -derivedDataPath build -only-testing:${SCHEME}Tests CODE_SIGNING_ALLOWED=NO 2>&1 \
              | tee -a test.log | grep -E "Test Case .*(passed|failed)|error:|TEST (SUCCEEDED|FAILED)|Executed" | tail -150 || true
            RAN=$((RAN + 1))
          done
          echo "Test runs: $RAN"
          [ "$(grep -c 'TEST SUCCEEDED' test.log || true)" -eq "$RAN" ]

      - name: Show test failures
        if: failure()
        run: grep -nE "error:|Test Case .*failed|TEST FAILED" test.log | head -120 || true

      - name: Run in simulator and screenshot
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        run: bash .github/scripts/screenshots.sh

      # Ride Quest only (Food Book was dropped, Natal Orbit is paused): fails on an app crash, a web process crash or
      # an uncaught JavaScript error / unhandled rejection; skipped when it wasn't built or no simulator is usable.
      - name: Run the web apps and screenshot
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 20
        run: bash .github/scripts/webshots.sh

      - name: Run the other apps in the simulator and screenshot (Roamr drive, Clicker, Pulse Lab, Still Point)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 25
        run: bash .github/scripts/appshots.sh

      - name: Upload screenshots
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore

      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          # Runs that build nothing with a screen (or skip the simulator) leave shots/ empty: nothing to publish.
          if [ -z "$(find shots -type f 2>/dev/null | head -1)" ]; then echo "No screenshots this run; nothing to publish."; exit 0; fi
          TMP=$(mktemp -d)
          cp -R shots/. "$TMP"/
          cd "$TMP"
          git init -q -b ci-screenshots
          git config user.name "TreeHub CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f "$URL" ci-screenshots || { sleep 20; git push -f "$URL" ci-screenshots; }

      - name: Commit generated Xcode project
        if: success()
        run: |
          git config user.name "TreeHub CI"
          git config user.email "ci@users.noreply.github.com"
          # The project plus the Info.plists / entitlements xcodegen writes that are kept in git (Natal Orbit is
          # paused: its files stay as they are; Food Book was dropped). Only files that exist are added.
          FILES="TreeHub.xcodeproj TreeHub/Info.plist TreeHub/TreeHub.entitlements TrackApp/Info.plist TrackApp/TrackHub.entitlements
            RootboundWidgets/Info.plist RootboundWatch/Info.plist RootboundWatch/RootboundWatch.entitlements RootboundWatchWidgets/Info.plist
            RoamrWidgets/Info.plist RoamrWatch/Info.plist WebApps/QuestApp/Info.plist
            TVRemote/Info.plist ClankerrWatch/Info.plist PulseLab/Info.plist PulseLab/PulseLab.entitlements
            StillPoint/Info.plist StillPoint/StillPoint.entitlements StillPointWatch/Info.plist StillPointWatch/StillPointWatch.entitlements"
          git add -- $(for f in $FILES; do [ -e "$f" ] && echo "$f"; done)
          if git diff --cached --quiet; then echo "Project unchanged"; exit 0; fi
          git commit -q -m "Update generated Xcode project [skip ci]"
          git show --stat --format="Committing: %s" HEAD | head -30
          # Other helpers push to main all the time: rebase onto the newest main (setting aside any other file the
          # build touched) and retry; if main keeps moving, the next green build commits the project instead.
          for i in 1 2 3; do
            if git pull -q --rebase --autostash origin main; then
              git push -q origin HEAD:main && { echo "Pushed the regenerated project"; exit 0; }
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "main moved on meanwhile (attempt $i); trying again"; sleep $((i * 10))
          done
          echo "::warning title=Generated Xcode project not committed::main kept moving; the next green build will commit it."
