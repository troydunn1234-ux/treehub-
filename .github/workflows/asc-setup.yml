name: App Store setup (age rating + countries)
on:
  workflow_dispatch:
    inputs:
      bundle: {description: Bundle ID, default: com.troydunn.clicker}
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pip install --quiet "pyjwt[crypto]"
          printf '%s\n' "$P8" > /tmp/key.p8
          KEY_PATH=/tmp/key.p8 python3 .github/scripts/asc_setup.py "${{ inputs.bundle }}"
          KEY_PATH=/tmp/key.p8 python3 .github/scripts/asc_attach_build.py "${{ inputs.bundle }}"
          rm -f /tmp/key.p8
