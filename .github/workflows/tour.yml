name: Video tour

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tour:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Record TreeHub tour
        run: bash .github/scripts/tour.sh TreeHub com.troydunn.treehub treehub-tour
      - name: Record TrackHub tour
        run: bash .github/scripts/tour.sh TrackHub com.troydunn.trackhub trackhub-tour
      - name: Publish to the ci-tour branch
        run: |
          TMP=$(mktemp -d); cp -R shots/. "$TMP"/; cd "$TMP"
          git init -q -b ci-tour
          git config user.name "TreeHub CI"; git config user.email "ci@users.noreply.github.com"
          git add -A; git commit -q -m "Tour for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-tour
